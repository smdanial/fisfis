<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fis-Fis</title>
<style>
  :root { color-scheme: dark; }
  body { background:#111; color:#eee; font-family: system-ui, sans-serif; max-width:640px; margin:0 auto; padding:2rem 1rem; }
  h1 { font-size:1.5rem; text-align:center; }
  #mic { display:block; margin:1rem auto; width:110px; height:110px; border-radius:50%;
         border:3px solid #4ade80; background:#1a1a1a; color:#4ade80; font-size:3rem; cursor:pointer; }
  #mic.rec { background:#4ade80; color:#111; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(74,222,128,.15); } }
  #status { text-align:center; min-height:1.4rem; color:#aaa; margin:.6rem 0; }
  #result { background:#1a1a1a; border:1px solid #333; border-radius:10px; padding:1rem;
            font-size:1.25rem; white-space:pre-line; min-height:2rem; margin-bottom:.4rem; }
  #transcript { color:#888; font-size:.85rem; margin:.4rem 0 0; }
  #warning { color:#fbbf24; font-size:.85rem; margin:.4rem 0; }
  .row { display:flex; gap:.6rem; align-items:center; justify-content:space-between; }
  button.mini { background:none; border:1px solid #555; color:#eee; padding:.35rem .9rem;
                border-radius:6px; cursor:pointer; font-size:.85rem; }
  select { background:#1a1a1a; color:#eee; border:1px solid #555; border-radius:6px; padding:.35rem; font-size:.85rem; }
</style>
</head>
<body>
<h1>🎙️Fis-Fis</h1>
<div class="row" style="margin-bottom:.5rem">
  <select id="backend" title="STT + note backend">
    <option value="gemini">gemini</option>
    <option value="whisper">whisper</option>
  </select>
</div>
<button id="mic" title="Click to record">🎤</button>
<div id="status"></div>
<div id="warning"></div>
<div id="result"></div>
<p id="transcript"></p>
<div class="row">
  <button class="mini" id="copy">Copy</button>
  <span></span>
</div>

<script>
const mic = document.getElementById('mic');
const status = document.getElementById('status');
const warnEl = document.getElementById('warning');
const resultEl = document.getElementById('result');
const transcriptEl = document.getElementById('transcript');
let media = null, chunks = [], recording = false;

mic.onclick = async () => {
  if (recording) { media.stop(); return; }
  warnEl.textContent = ''; resultEl.textContent = ''; transcriptEl.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    media = new MediaRecorder(stream);
    chunks = [];
    media.ondataavailable = e => chunks.push(e.data);
    media.onstop = async () => {
      recording = false;
      mic.classList.remove('rec'); mic.textContent = '🎤';
      stream.getTracks().forEach(t => t.stop());
      status.textContent = 'Thinking...';
      const blob = new Blob(chunks, { type: media.mimeType || 'audio/webm' });
      await submit(blob);
    };
    media.start();
    recording = true;
    mic.classList.add('rec'); mic.textContent = '⏹';
    status.textContent = 'Listening...';
  } catch (e) {
    status.textContent = '';
    warnEl.textContent = 'Mic error: ' + e.message;
  }
};

async function submit(blob) {
  warnEl.textContent = '';
  try {
    const fd = new FormData();
    fd.append('audio', blob, 'speech.webm');
    fd.append('backend', document.getElementById('backend').value);
    const res = await fetch('/api/transcribe', { method: 'POST', body: fd });
    const data = await res.json();
    status.textContent = '';
    warnEl.textContent = data.warning ? '⚠️ ' + data.warning : '';
    resultEl.textContent = data.result || '';
    transcriptEl.textContent = data.transcript ? 'heard: ' + data.transcript : '';
  } catch (e) {
    status.textContent = '';
    warnEl.textContent = 'Network error: ' + e.message;
  }
}

document.getElementById('copy').onclick = () => navigator.clipboard.writeText(resultEl.textContent);
</script>
</body>
</html>
